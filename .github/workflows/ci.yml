name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  checks:
    name: Lint, typecheck, unit tests, contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make contracts-check

  integration:
    name: Integration (PostgreSQL + Redis) and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kofclub
          POSTGRES_PASSWORD: kofclub_ci
          POSTGRES_DB: kofclub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kofclub" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      APP_ENV: test
      DATABASE_URL: postgres://kofclub:kofclub_ci@localhost:5432/kofclub?sslmode=disable
      TEST_DATABASE_URL: postgres://kofclub:kofclub_ci@localhost:5432/kofclub?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - name: Migrations apply, roll back and re-apply
        run: |
          go run ./go/cmd/migrate up
          go run ./go/cmd/migrate down 1
          go run ./go/cmd/migrate up
          go run ./go/cmd/migrate version
      - run: make integration

  e2e:
    name: Browser end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kofclub
          POSTGRES_PASSWORD: kofclub_ci
          POSTGRES_DB: kofclub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kofclub" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://kofclub:kofclub_ci@localhost:5432/kofclub?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      E2E_LOG_DIR: ${{ github.workspace }}/e2e-logs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kofclub/web exec playwright install --with-deps chromium
      - run: ./scripts/init-env.sh
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e-logs
            apps/web/test-results
            apps/web/playwright-report

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history for secrets
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities (npm, Go)
        run: make audit
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --no-banner --redact --verbose

  ops-drills:
    name: Load smoke and restore drill
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kofclub
          POSTGRES_PASSWORD: kofclub_ci
          POSTGRES_DB: kofclub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kofclub" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://kofclub:kofclub_ci@localhost:5432/kofclub?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/init-env.sh
      - name: Load smoke (fails on latency, errors or ledger mismatch)
        run: make load-smoke ARGS="-game MIXED -tables 10 -players 4 -duration 20s"
      - name: Backup and restore drill
        run: make backup-restore-check
      - name: Alert rules and dashboards (promtool)
        run: make observability-check
      - name: End-to-end tracing check (Jaeger)
        run: make trace-check

  compose:
    name: Docker Compose stack + browser E2E
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kofclub/web exec playwright install --with-deps chromium
      - name: Build images and start the stack (make dev)
        run: make dev
      - name: Playwright against the containerized stack
        run: pnpm --filter @kofclub/web exec playwright test
        env:
          E2E_BASE_URL: http://localhost:3000
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-artifacts
          path: |
            compose.log
            apps/web/test-results
