    MemberBalancePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemberBalance'
        nextCursor:
          type: string
          nullable: true
    Table:
      type: object
      required:
        [
          id,
          clubId,
          name,
          gameType,
          maxSeats,
          smallBlind,
          bigBlind,
          buyInMin,
          buyInMax,
          actionTimeoutSec,
          status,
          createdBy,
          createdAt,
          seatedCount,
          tournamentId,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        clubId:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        gameType:
          $ref: './realtime.yaml#/components/schemas/GameType'
        tournamentId:
          type: string
          format: uuid
          nullable: true
          description: Set for a tournament's tables (seats are assigned by the tournament).
        maxSeats:
          type: integer
        smallBlind:
          $ref: '#/components/schemas/ChipAmount'
        bigBlind:
          $ref: '#/components/schemas/ChipAmount'
        buyInMin:
          $ref: '#/components/schemas/ChipAmount'
        buyInMax:
          $ref: '#/components/schemas/ChipAmount'
        actionTimeoutSec:
          type: integer
        status:
          type: string
          enum: [OPEN, CLOSED]
        createdBy:
          $ref: '#/components/schemas/Uuid'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        seatedCount:
          type: integer
    TableSeat:
      type: object
      additionalProperties: false
      required: [seatNo, userId, username, stack, sittingOut]
      properties:
        seatNo:
          type: integer
        userId:
          $ref: '#/components/schemas/Uuid'
        username:
          type: string
        stack:
          $ref: '#/components/schemas/ChipAmount'
        sittingOut:
          type: boolean
    TableDetail:
      allOf:
        - $ref: '#/components/schemas/Table'
        - type: object
          required: [seats]
          properties:
            seats:
              type: array
              items:
                $ref: '#/components/schemas/TableSeat'
    TableList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Table'
    CreateTableRequest:
      type: object
      additionalProperties: false
      required: [name, smallBlind, bigBlind, buyInMin, buyInMax]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 64
        gameType:
          type: string
          enum: [NLHE, PLO]
          default: NLHE
          description: See GameType. Fixed for the table's lifetime.
        maxSeats:
          type: integer
          minimum: 2
          maximum: 10
          default: 6
        smallBlind:
          $ref: '#/components/schemas/ChipAmount'
        bigBlind:
          $ref: '#/components/schemas/ChipAmount'
        buyInMin:
          $ref: '#/components/schemas/ChipAmount'
        buyInMax:
          $ref: '#/components/schemas/ChipAmount'
        actionTimeoutSec:
          type: integer
          minimum: 5
          maximum: 120
          default: 20
    TournamentStatus:
      type: string
      enum: [REGISTERING, RUNNING, FINISHED, CANCELLED]
    TournamentStartMode:
      type: string
      enum: [SIT_AND_GO, SCHEDULED]
      description: SIT_AND_GO starts when maxPlayers registered; SCHEDULED at startsAt (cancelled and refunded if fewer than minPlayers).
    BlindLevel:
      type: object
      additionalProperties: false
      required: [level, smallBlind, bigBlind]
      properties:
        level:
          type: integer
        smallBlind:
          $ref: '#/components/schemas/ChipAmount'
        bigBlind:
          $ref: '#/components/schemas/ChipAmount'
    Tournament:
      type: object
      description: No additionalProperties restriction because TournamentDetail extends it (allOf).
      required:
        [
          id,
          clubId,
          name,
          gameType,
          status,
          startMode,
          startsAt,
          buyIn,
          startingStack,
          seatsPerTable,
          minPlayers,
          maxPlayers,
          levelDurationSec,
          actionTimeoutSec,
          registeredCount,
          prizePool,
          registered,
          createdAt,
          startedAt,
          finishedAt,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        clubId:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        gameType:
          $ref: './realtime.yaml#/components/schemas/GameType'
        status:
          $ref: '#/components/schemas/TournamentStatus'
        startMode:
          $ref: '#/components/schemas/TournamentStartMode'
        startsAt:
          type: string
          format: date-time
          nullable: true
        buyIn:
          $ref: '#/components/schemas/ChipAmount'
        startingStack:
          type: integer
          format: int64
          description: Tournament chips each player starts with (not club chips).
        seatsPerTable:
          type: integer
        minPlayers:
          type: integer
        maxPlayers:
          type: integer
        levelDurationSec:
          type: integer
        actionTimeoutSec:
          type: integer
        registeredCount:
          type: integer
          description: Active registrations (entrants once started).
        prizePool:
          $ref: '#/components/schemas/ChipAmount'
        registered:
          type: boolean
          description: Whether the viewer holds an active registration / entry.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
    TournamentEntrant:
      type: object
      additionalProperties: false
      required: [userId, username, place, prize, tableId, stack]
      properties:
        userId:
          $ref: '#/components/schemas/Uuid'
        username:
          type: string
        place:
          type: integer
          nullable: true
          description: Finishing place (null while still playing); tied players share a place.
        prize:
          $ref: '#/components/schemas/ChipAmount'
        tableId:
          type: string
          format: uuid
          nullable: true
          description: Current (or destination, while moving) table.
        stack:
          type: integer
          format: int64
          nullable: true
          description: Tournament chips at the last completed hand (null when out or moving).
    TournamentPayout:
      type: object
      additionalProperties: false
      required: [place, amount]
      properties:
        place:
          type: integer
        amount:
          $ref: '#/components/schemas/ChipAmount'
    TournamentDetail:
      allOf:
        - $ref: '#/components/schemas/Tournament'
        - type: object
          required: [levels, currentLevel, levelEndsAt, payouts, entrants, playersLeft, myTableId]
          properties:
            levels:
              type: array
              description: The first levels of the blind schedule (later levels keep doubling).
              items:
                $ref: '#/components/schemas/BlindLevel'
            currentLevel:
              type: object
              nullable: true
              description: The level in effect for new hands (null before the start and after the end).
              additionalProperties: false
              required: [level, smallBlind, bigBlind]
              properties:
                level:
                  type: integer
                smallBlind:
                  $ref: '#/components/schemas/ChipAmount'
                bigBlind:
                  $ref: '#/components/schemas/ChipAmount'
            levelEndsAt:
              type: string
              format: date-time
              nullable: true
            payouts:
              type: array
              description: Prizes by place (projected from current registrations before the start).
              items:
                $ref: '#/components/schemas/TournamentPayout'
            entrants:
              type: array
              items:
                $ref: '#/components/schemas/TournamentEntrant'
            playersLeft:
              type: integer
            myTableId:
              type: string
              format: uuid
              nullable: true
    TournamentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tournament'
    CreateTournamentRequest:
      type: object
      additionalProperties: false
      required:
        [name, buyIn, startingStack, smallBlind, bigBlind, levelDurationSec, maxPlayers, startMode]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 56
        gameType:
          type: string
          enum: [NLHE, PLO]
          default: NLHE
        buyIn:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
          description: Club chips paid into the prize pool (0 = freeroll).
        startingStack:
          type: integer
          format: int64
          minimum: 100
          maximum: 1000000000
        smallBlind:
          type: integer
          format: int64
          minimum: 1
          description: Level 1 small blind; later levels follow a standard progression.
        bigBlind:
          type: integer
          format: int64
          minimum: 2
          description: Level 1 big blind (at most a tenth of the starting stack).
        levelDurationSec:
          type: integer
          minimum: 10
          maximum: 3600
        seatsPerTable:
          type: integer
          minimum: 2
          maximum: 10
          default: 6
        minPlayers:
          type: integer
          minimum: 2
          maximum: 100
          default: 2
        maxPlayers:
          type: integer
          minimum: 2
          maximum: 100
        startMode:
          $ref: '#/components/schemas/TournamentStartMode'
        startsAt:
          type: string
          format: date-time
          description: Required for SCHEDULED (in the future); not allowed for SIT_AND_GO.
        actionTimeoutSec:
          type: integer
          minimum: 5
          maximum: 120
          default: 20
    SeatRequest:
      type: object
      additionalProperties: false
      required: [buyIn]
      properties:
        seatNo:
          type: integer
          minimum: 1
          maximum: 10
          description: Omit to take the first free seat.
        buyIn:
          $ref: '#/components/schemas/ChipAmount'
    SeatResult:
      type: object
      additionalProperties: false
      required: [tableId, seatNo, stack, seq]
      properties:
        tableId:
          $ref: '#/components/schemas/Uuid'
        seatNo:
          type: integer
        stack:
          $ref: '#/components/schemas/ChipAmount'
        seq:
          type: integer
          format: int64
    CloseTableResult:
      type: object
      additionalProperties: false
      required: [tableId, status, seated]
      properties:
        tableId:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum: [CLOSED, CLOSING]
          description: CLOSING while a hand finishes; seats are then cashed out.
        seated:
          type: integer
          description: Players still seated (0 once CLOSED).
    LeaveResult:
      type: object
      additionalProperties: false
      required: [tableId, status, cashOut]
      properties:
        tableId:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum: [LEFT, LEAVING_AFTER_HAND]
        cashOut:
          $ref: '#/components/schemas/ChipAmount'
    HandSummary:
      type: object
      description: No additionalProperties restriction because HandDetail extends it (allOf).
      required:
        [
          id,
          tableId,
          tableName,
          clubId,
          clubName,
          handNo,
          gameType,
          tournamentId,
          status,
          smallBlind,
          bigBlind,
          board,
          pot,
          playerCount,
          myNet,
          startedAt,
          endedAt,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tableId:
          $ref: '#/components/schemas/Uuid'
        tableName:
          type: string
        clubId:
          $ref: '#/components/schemas/Uuid'
        clubName:
          type: string
        handNo:
          type: integer
          format: int64
        gameType:
          $ref: './realtime.yaml#/components/schemas/GameType'
        tournamentId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [COMPLETED, VOIDED]
        smallBlind:
          $ref: '#/components/schemas/ChipAmount'
        bigBlind:
          $ref: '#/components/schemas/ChipAmount'
        board:
          type: array
          items:
            $ref: './realtime.yaml#/components/schemas/Card'
        pot:
          $ref: '#/components/schemas/ChipAmount'
        playerCount:
          type: integer
        myNet:
          type: integer
          format: int64
          nullable: true
          description: The viewer's result; null when the viewer did not play or the hand was voided.
        startedAt:
          $ref: '#/components/schemas/Timestamp'
        endedAt:
          $ref: '#/components/schemas/Timestamp'
    HandSummaryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HandSummary'
        nextCursor:
          type: string
          nullable: true
    HandParticipant:
      type: object
      additionalProperties: false
      required:
        [
          seat,
          userId,
          username,
          startingStack,
          endingStack,
          contributed,
          won,
          net,
          folded,
          shownCards,
        ]
      properties:
        seat:
          type: integer
        userId:
          $ref: '#/components/schemas/Uuid'
        username:
          type: string
        startingStack:
          $ref: '#/components/schemas/ChipAmount'
        endingStack:
          type: integer
          format: int64
          nullable: true
        contributed:
          type: integer
          format: int64
          nullable: true
        won:
          type: integer
          format: int64
          nullable: true
        net:
          type: integer
          format: int64
          nullable: true
        folded:
          type: boolean
          nullable: true
        shownCards:
          type: array
          nullable: true
          description: Cards revealed at showdown (public); null when not shown.
          items:
            $ref: './realtime.yaml#/components/schemas/Card'
    HandEventRecord:
      type: object
      additionalProperties: false
      required: [seq, createdAt, event]
      properties:
        seq:
          type: integer
          format: int64
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        event:
          $ref: './realtime.yaml#/components/schemas/TableEventPayload'
    HandDetail:
      allOf:
        - $ref: '#/components/schemas/HandSummary'
        - type: object
          required:
            [buttonSeat, deckCommitment, voidReason, players, myHoleCards, events, viewerRole]
          properties:
            buttonSeat:
              type: integer
            deckCommitment:
              type: string
              description: SHA-256 commitment to the shuffled deck (internal audit).
            voidReason:
              type: string
              nullable: true
            players:
              type: array
              items:
                $ref: '#/components/schemas/HandParticipant'
            myHoleCards:
              type: array
              nullable: true
              description: The viewer's own hole cards; null for non-participants.
              items:
                $ref: './realtime.yaml#/components/schemas/Card'
            events:
              type: array
              description: Public action log of the hand (never contains unrevealed cards).
              items:
                $ref: '#/components/schemas/HandEventRecord'
            viewerRole:
              type: string
              enum: [PARTICIPANT, CLUB_STAFF, PLATFORM_ADMIN]
    PlatformOverview:
      type: object
      additionalProperties: false
      required: [users, clubs, tables, hands, sessions, risk, ledger, generatedAt]
      properties:
        users:
          type: object
          additionalProperties: false
          required: [total, suspended, platformAdmins]
          properties:
            total: { type: integer }
            suspended: { type: integer }
            platformAdmins: { type: integer }
        clubs:
          type: object
          additionalProperties: false
          required: [total, active, suspended]
          properties:
            total: { type: integer }
            active: { type: integer }
            suspended: { type: integer }
        tables:
          type: object
          additionalProperties: false
          required: [open, seatedPlayers]
          properties:
            open: { type: integer }
            seatedPlayers: { type: integer }
        hands:
          type: object
          additionalProperties: false
          required: [inProgress, completedLast24h, voidedLast24h]
          properties:
            inProgress: { type: integer }
            completedLast24h: { type: integer }
            voidedLast24h: { type: integer }
        sessions:
          type: object
          additionalProperties: false
          required: [active]
          properties:
            active: { type: integer }
        risk:
          type: object
          additionalProperties: false
          required: [openEvents, highSeverityOpen]
          properties:
            openEvents: { type: integer }
            highSeverityOpen: { type: integer }
        ledger:
          type: object
          additionalProperties: false
          required: [invariantViolations]
          properties:
            invariantViolations:
              type: integer
              description: Must always be 0; anything else pages the on-call (docs/runbooks).
        generatedAt:
          $ref: '#/components/schemas/Timestamp'
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, username, email, status, platformRole, createdAt, clubCount, activeSessions]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        username:
          type: string
        email:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'
        platformRole:
          $ref: '#/components/schemas/PlatformRole'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        clubCount:
          type: integer
        activeSessions:
          type: integer
    AdminUserPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        nextCursor:
          type: string
          nullable: true
    AdminClub:
      type: object
      additionalProperties: false
      required: [id, name, status, ownerUserId, ownerUsername, memberCount, openTables, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        status:
          $ref: '#/components/schemas/ClubStatus'
        ownerUserId:
          $ref: '#/components/schemas/Uuid'
        ownerUsername:
          type: string
        memberCount:
          type: integer
        openTables:
          type: integer
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    AdminClubPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminClub'
        nextCursor:
          type: string
          nullable: true
    UpdateAccountStatusRequest:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Recorded in the audit log.
    RiskEvent:
      type: object
      additionalProperties: false
      required:
        [
          id,
          subjectUserId,
          subjectUsername,
          clubId,
          type,
          severity,
          score,
          featureValues,
          evidenceRefs,
          createdAt,
          reviewedAt,
          reviewedBy,
          reviewedByUsername,
          disposition,
          reviewNote,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        subjectUserId:
          type: string
          format: uuid
          nullable: true
        subjectUsername:
          type: string
          nullable: true
        clubId:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        score:
          type: integer
        featureValues:
          type: object
          additionalProperties: true
        evidenceRefs:
          type: array
          items: {}
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        reviewedBy:
          type: string
          format: uuid
          nullable: true
        reviewedByUsername:
          type: string
          nullable: true
        disposition:
          type: string
          enum: [DISMISSED, CONFIRMED, ESCALATED, null]
          nullable: true
        reviewNote:
          type: string
          nullable: true
    RiskEventPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RiskEvent'
        nextCursor:
          type: string
          nullable: true
    ReviewRiskEventRequest:
      type: object
      additionalProperties: false
      required: [disposition, note]
      properties:
        disposition:
          type: string
          enum: [DISMISSED, CONFIRMED, ESCALATED]
        note:
          type: string
          minLength: 3
          maxLength: 1000
    HealthStatus:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok, unavailable, draining]
        service:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
    ErrorCode:
      type: string
      description: |
        Stable machine-readable error codes shared by HTTP and realtime APIs.
        Clients must branch on `code`, never on `message`.
      enum:
        # generic
        - VALIDATION_FAILED
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - INTERNAL
        - SERVICE_UNAVAILABLE
        - IDEMPOTENCY_CONFLICT
        # auth
        - AUTH_REQUIRED
