openapi: 3.0.3
info:
  title: KofClub Control API
  version: 0.1.0
  description: |
    Control-plane HTTP API (accounts, clubs, roles, table configuration,
    virtual-chip ledger administration, hand history).

    Conventions (see docs/adr/ADR-009-wire-conventions.md):
    - All endpoints are versioned under `/v1` (health probes are unversioned).
    - JSON bodies use camelCase; enums are UPPERCASE strings.
    - Identifiers are UUID strings (UUIDv7 preferred).
    - Timestamps are UTC RFC 3339 strings.
    - Chip amounts are integers (int64). Floating point is never used.
    - Every response carries an `X-Request-Id` header; clients may send one.
    - State-changing requests that may be retried accept an `Idempotency-Key` header.
    - Errors always use the `ErrorEnvelope` shape with a machine-readable `code`.

    Virtual chips have no monetary value. This API intentionally contains no
    deposit, withdrawal, cash-out or payment functionality (ADR-006).
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: health
    description: Liveness/readiness probes
  - name: auth
    description: Registration, login, token refresh, logout
  - name: me
    description: Current user profile and sessions
  - name: clubs
    description: Clubs, memberships, roles, invites, audit
  - name: ledger
    description: Virtual-chip wallets and club chip administration (no monetary value)
  - name: tables
    description: Table directory, seating (buy-in) and leaving (cash-out)
  - name: history
    description: Hand history with the ADR-008 visibility policy
  - name: tournaments
    description: Virtual-chip tournaments (registration, blind levels, balancing, prize payouts)
  - name: admin
    description: Platform administration (PLATFORM_ADMIN only)
paths:
  /health/live:
    get:
      tags: [health]
      operationId: getHealthLive
      summary: Liveness probe
      responses:
        '200':
          description: Process is serving HTTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /health/ready:
    get:
      tags: [health]
      operationId: getHealthReady
      summary: Readiness probe (checks PostgreSQL and Redis)
      responses:
        '200':
          description: All dependencies reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: A dependency is unavailable or the service is draining
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account and a first session
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthTransport'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Issue access + refresh tokens
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthTransport'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Rotate the refresh token (reuse revokes the session)
      description: |
        The refresh token is read from the body or, for browser clients, from
        the HttpOnly `kof_rt` cookie. Presenting an already-rotated token
        revokes the session (`AUTH_REFRESH_REUSED`).
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthTransport'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          $ref: '#/components/responses/Error'
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Error'
  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Current profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error'
  /v1/me/sessions:
    get:
      tags: [me]
      operationId: listMySessions
      summary: List active sessions/devices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/Error'
  /v1/me/sessions/{sessionId}:
    delete:
      tags: [me]
      operationId: revokeMySession
      summary: Revoke one of my sessions
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '204':
          description: Revoked
        '404':
          $ref: '#/components/responses/Error'
  /v1/clubs:
    post:
      tags: [clubs]
      operationId: createClub
      summary: Create a club (caller becomes OWNER)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClubRequest'
      responses:
        '201':
          description: Club created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '400':
          $ref: '#/components/responses/Error'
    get:
      tags: [clubs]
      operationId: listMyClubs
      summary: Clubs I am an active member of
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Clubs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubList'
  /v1/clubs/join:
    post:
      tags: [clubs]
      operationId: joinClubByCode
      summary: Join a club with a club join code or an invite code
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinClubRequest'
      responses:
        '200':
          description: Joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /v1/clubs/{clubId}:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [clubs]
      operationId: getClub
      summary: Club details
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags: [clubs]
      operationId: updateClub
      summary: Rename the club or edit its description (OWNER)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClubRequest'
      responses:
        '200':
          description: Updated club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /v1/clubs/{clubId}/transfer-ownership:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    post:
      tags: [clubs]
      operationId: transferClubOwnership
      summary: Hand the club to another active member (OWNER); the previous owner becomes ADMIN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipRequest'
      responses:
        '200':
          description: Club after the transfer (viewed by the previous owner)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /v1/clubs/{clubId}/join:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    post:
      tags: [clubs]
      operationId: joinClub
      summary: Join this club by join code or invite code
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinClubRequest'
      responses:
        '200':
          description: Joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /v1/clubs/{clubId}/leave:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    post:
      tags: [clubs]
      operationId: leaveClub
      summary: Leave the club (owners cannot leave)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Left
        '403':
          $ref: '#/components/responses/Error'
  /v1/clubs/{clubId}/join-code/rotate:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    post:
      tags: [clubs]
      operationId: rotateClubJoinCode
      summary: Replace the club join code (ADMIN+)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Club with the new join code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '403':
          $ref: '#/components/responses/Error'
  /v1/clubs/{clubId}/members:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [clubs]
      operationId: listClubMembers
      summary: Members (keyset-paginated)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          description: Filter by status (staff only; members always see ACTIVE).
          schema:
            $ref: '#/components/schemas/MemberStatus'
      responses:
        '200':
          description: Page of members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '403':
          $ref: '#/components/responses/Error'
  /v1/clubs/{clubId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - name: userId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    patch:
      tags: [clubs]
      operationId: updateClubMember
      summary: Change a member's role or status (ban/unban)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /v1/clubs/{clubId}/invites:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    post:
      tags: [clubs]
      operationId: createClubInvite
      summary: Create an invite code (AGENT+; AGENT-role invites need ADMIN+)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Invite created; the code is only returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteCreated'
        '403':
          $ref: '#/components/responses/Error'
    get:
      tags: [clubs]
      operationId: listClubInvites
      summary: List invites (codes are never returned)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteList'
        '403':
          $ref: '#/components/responses/Error'
  /v1/clubs/{clubId}/invites/{inviteId}:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - name: inviteId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    delete:
      tags: [clubs]
      operationId: revokeClubInvite
      summary: Revoke an invite
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Revoked
        '404':
          $ref: '#/components/responses/Error'
  /v1/clubs/{clubId}/audit-log:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [clubs]
      operationId: listClubAuditLog
      summary: Privileged-action audit log (ADMIN+, platform admins)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of audit records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '403':
          $ref: '#/components/responses/Error'
  /v1/clubs/{clubId}/wallet:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [ledger]
      operationId: getMyWallet
      summary: My virtual-chip wallet balance in this club
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '403':
          $ref: '#/components/responses/Error'
  /v1/clubs/{clubId}/wallet/entries:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [ledger]
      operationId: listMyWalletEntries
      summary: My wallet movements (newest first)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletEntryPage'
  /v1/clubs/{clubId}/chips/grants:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    post:
      tags: [ledger]
      operationId: grantChips
      summary: Grant virtual chips from the club treasury to a member (ADMIN+)
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Required for chip movements; retries with the same key never move chips twice.
          schema:
            type: string
            pattern: '^[A-Za-z0-9._:-]{8,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChipMovementRequest'
      responses:
        '201':
          description: Posted ledger transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerTransaction'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /v1/clubs/{clubId}/chips/deductions:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    post:
      tags: [ledger]
      operationId: deductChips
      summary: Return a member's chips to the club treasury (ADMIN+)
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Required for chip movements; retries with the same key never move chips twice.
          schema:
            type: string
            pattern: '^[A-Za-z0-9._:-]{8,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChipMovementRequest'
      responses:
        '201':
          description: Posted ledger transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerTransaction'
        '422':
          $ref: '#/components/responses/Error'
  /v1/clubs/{clubId}/ledger/summary:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [ledger]
      operationId: getLedgerSummary
      summary: Chips in circulation (ADMIN+, platform admins)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerSummary'
  /v1/clubs/{clubId}/ledger/balances:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [ledger]
      operationId: listMemberBalances
      summary: Member wallet and table balances (ADMIN+)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberBalancePage'
  /v1/clubs/{clubId}/ledger/transactions:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [ledger]
      operationId: listLedgerTransactions
      summary: Club ledger transactions with entries (ADMIN+)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerTransactionPage'
  /v1/clubs/{clubId}/ledger/transactions/{txId}/reversal:
    parameters:
      - $ref: '#/components/parameters/ClubId'
      - name: txId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    post:
      tags: [ledger]
      operationId: reverseLedgerTransaction
      summary: Reverse an administrative chip movement (ADMIN+)
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Required for chip movements; retries with the same key never move chips twice.
          schema:
            type: string
            pattern: '^[A-Za-z0-9._:-]{8,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReversalRequest'
      responses:
        '201':
          description: Posted reversal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerTransaction'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /v1/clubs/{clubId}/tables:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    post:
      tags: [tables]
      operationId: createTable
      summary: Create a No-Limit Hold'em table (ADMIN+)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTableRequest'
      responses:
        '201':
          description: Table created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDetail'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    get:
      tags: [tables]
      operationId: listClubTables
      summary: Tables of a club
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableList'
  /v1/tables/{tableId}:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      tags: [tables]
      operationId: getTable
      summary: Table configuration and seated players
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDetail'
        '404':
          $ref: '#/components/responses/Error'
  /v1/tables/{tableId}/seat:
    parameters:
      - $ref: '#/components/parameters/TableId'
    post:
      tags: [tables]
      operationId: takeSeat
      summary: Buy in from the club wallet and take a seat
      description: The Idempotency-Key (if given) makes retried buy-ins safe.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatRequest'
      responses:
        '200':
          description: Seated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatResult'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /v1/tables/{tableId}/leave:
    parameters:
      - $ref: '#/components/parameters/TableId'
    post:
      tags: [tables]
      operationId: leaveTable
      summary: Leave the table; the stack is cashed out to the club wallet (after the current hand if needed)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Left or leaving after the hand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveResult'
        '409':
          $ref: '#/components/responses/Error'
  /v1/tables/{tableId}/close:
    parameters:
      - $ref: '#/components/parameters/TableId'
    post:
      tags: [tables]
      operationId: closeTable
      summary: Close the table for good (ADMIN+); seated players are cashed out to their wallets
      description: |
        No new hands are dealt. When no hand is in progress every seat is
        cashed out immediately (status CLOSED); otherwise after the current
        hand (status CLOSING). Safe to retry.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Closure applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseTableResult'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/tables/{tableId}/state:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      tags: [tables]
      operationId: getTableState
      summary: Viewer-sanitized table snapshot (realtime clients use TABLE_SNAPSHOT instead)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: './realtime.yaml#/components/schemas/TableSnapshot'
        '403':
          $ref: '#/components/responses/Error'
  /v1/me/hands:
    get:
      tags: [history]
      operationId: listMyHands
      summary: Hands I was dealt into (finished hands, newest first)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of hand summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandSummaryPage'
        '401':
          $ref: '#/components/responses/Error'
  /v1/hands/{handId}:
    parameters:
      - $ref: '#/components/parameters/HandId'
    get:
      tags: [history]
      operationId: getHand
      summary: Visible hand record (ADR-008 visibility policy)
      description: |
        Participants see the public action log, the board, cards shown at
        showdown and their own hole cards. Club staff (ADMIN+) and platform
        admins see the same public record without anyone's unrevealed cards.
        Anyone else receives HAND_NOT_FOUND.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Hand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandDetail'
        '404':
          $ref: '#/components/responses/Error'
  /v1/clubs/{clubId}/hands:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    get:
      tags: [history]
      operationId: listClubHands
      summary: Finished hands in a club (ADMIN+ audit view, newest first)
      security:
        - bearerAuth: []
      parameters:
        - name: tableId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of hand summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandSummaryPage'
        '403':
          $ref: '#/components/responses/Error'
  /v1/clubs/{clubId}/tournaments:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    post:
      tags: [tournaments]
      operationId: createTournament
      summary: Create a tournament and its tables (ADMIN+)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTournamentRequest'
      responses:
        '201':
          description: Tournament created (registration open)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentDetail'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    get:
      tags: [tournaments]
      operationId: listClubTournaments
      summary: Tournaments of a club, newest first
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tournaments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentList'
        '403':
          $ref: '#/components/responses/Error'
  /v1/tournaments/{tournamentId}:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    get:
      tags: [tournaments]
      operationId: getTournament
      summary: Structure, prize pool, payouts and entrants (live places and tables)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tournament
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentDetail'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /v1/tournaments/{tournamentId}/register:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    post:
      tags: [tournaments]
      operationId: registerForTournament
      summary: Register, paying the buy-in from the club wallet into the prize pool
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentDetail'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /v1/tournaments/{tournamentId}/unregister:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    post:
      tags: [tournaments]
      operationId: unregisterFromTournament
      summary: Unregister before the start; the buy-in is refunded
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unregistered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentDetail'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /v1/tournaments/{tournamentId}/start:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    post:
      tags: [tournaments]
      operationId: startTournament
      summary: Start now with the registered players (ADMIN+; at least minPlayers)
      description: The game service seats the players within about a second.
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Start requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentDetail'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /v1/tournaments/{tournamentId}/cancel:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    post:
      tags: [tournaments]
      operationId: cancelTournament
      summary: Cancel before the start (ADMIN+); every buy-in is refunded
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentDetail'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /v1/admin/overview:
    get:
      tags: [admin]
      operationId: adminOverview
      summary: Platform operational overview (PLATFORM_ADMIN)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOverview'
        '403':
          $ref: '#/components/responses/Error'
  /v1/admin/users:
    get:
      tags: [admin]
      operationId: adminSearchUsers
      summary: Search accounts (PLATFORM_ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive prefix (username/email for users, name for clubs).
          schema:
            type: string
            maxLength: 64
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /v1/admin/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    patch:
      tags: [admin]
      operationId: adminSetUserStatus
      summary: Suspend or reinstate an account; suspension revokes every session (PLATFORM_ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /v1/admin/clubs:
    get:
      tags: [admin]
      operationId: adminSearchClubs
      summary: Search clubs (PLATFORM_ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive prefix (username/email for users, name for clubs).
          schema:
            type: string
            maxLength: 64
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClubPage'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /v1/admin/clubs/{clubId}:
    parameters:
      - $ref: '#/components/parameters/ClubId'
    patch:
      tags: [admin]
      operationId: adminSetClubStatus
      summary: Suspend (view-only) or reinstate a club (PLATFORM_ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminClub'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /v1/admin/audit-log:
    get:
      tags: [admin]
      operationId: adminAuditLog
      summary: Platform-wide audit log (PLATFORM_ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: clubId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: actorUserId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: action
          in: query
          required: false
          schema:
            type: string
            pattern: '^[A-Z_]{3,64}$'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /v1/admin/risk-events:
    get:
      tags: [admin]
      operationId: adminRiskEvents
      summary: Risk cases awaiting (OPEN) or after (REVIEWED) review (PLATFORM_ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [OPEN, REVIEWED]
            default: OPEN
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskEventPage'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /v1/admin/risk-events/{eventId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    patch:
      tags: [admin]
      operationId: adminReviewRiskEvent
      summary: Record a review disposition (evidence stays immutable) (PLATFORM_ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRiskEventRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskEvent'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TableId:
      name: tableId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TournamentId:
      name: tournamentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    HandId:
      name: handId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ClubId:
      name: clubId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `nextCursor`.
      schema:
        type: string
        maxLength: 512
    AuthTransport:
      name: X-Auth-Transport
      in: header
      required: false
      description: |
        `cookie` makes the API deliver the refresh token in an HttpOnly
        SameSite=Strict cookie (`kof_rt`, path `/v1/auth`) instead of the body.
      schema:
        type: string
        enum: [cookie, body]
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Client-supplied correlation id (echoed back).
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Unique key making a retried state-changing request a no-op.
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    Error:
      description: Machine-readable error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
      description: UTC RFC 3339 timestamp
    ChipAmount:
      type: integer
      format: int64
      description: Integer amount of virtual chips (no monetary value).
    PlatformRole:
      type: string
      enum: [USER, PLATFORM_ADMIN]
    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, DELETED]
    User:
      type: object
      additionalProperties: false
      required: [id, email, username, status, platformRole, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
        username:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'
        platformRole:
          $ref: '#/components/schemas/PlatformRole'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, username, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        username:
          type: string
          pattern: '^[A-Za-z0-9_]{3,24}$'
        password:
          type: string
          minLength: 10
          maxLength: 128
        deviceId:
          type: string
          maxLength: 128
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          type: string
          description: Email or username
        password:
          type: string
        deviceId:
          type: string
          maxLength: 128
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
    AuthResult:
      type: object
      additionalProperties: false
      required: [user, sessionId, accessToken, accessTokenExpiresAt, refreshTokenExpiresAt]
      properties:
        user:
          $ref: '#/components/schemas/User'
        sessionId:
          $ref: '#/components/schemas/Uuid'
        accessToken:
          type: string
          description: EdDSA JWT, ~15 minutes
        accessTokenExpiresAt:
          $ref: '#/components/schemas/Timestamp'
        refreshToken:
          type: string
          description: Opaque token; omitted when cookie transport is used
        refreshTokenExpiresAt:
          $ref: '#/components/schemas/Timestamp'
    Session:
      type: object
      additionalProperties: false
      required: [id, deviceId, userAgent, createdAt, lastUsedAt, expiresAt, current]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        deviceId:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastUsedAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        current:
          type: boolean
    SessionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    ClubRole:
      type: string
      enum: [OWNER, ADMIN, AGENT, MEMBER]
    ClubStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, CLOSED]
    MemberStatus:
      type: string
      enum: [ACTIVE, BANNED, LEFT]
    Club:
      type: object
      additionalProperties: false
      required: [id, name, description, status, ownerUserId, createdAt, myRole]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ClubStatus'
        ownerUserId:
          $ref: '#/components/schemas/Uuid'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        myRole:
          type: string
          enum: [OWNER, ADMIN, AGENT, MEMBER, null]
          nullable: true
          description: Null when viewed through platform-admin oversight.
        memberCount:
          type: integer
        joinCode:
          type: string
          description: Visible to AGENT and above only.
    ClubList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Club'
    CreateClubRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 64
        description:
          type: string
          maxLength: 500
    UpdateClubRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 64
        description:
          type: string
          nullable: true
          maxLength: 500
    TransferOwnershipRequest:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          $ref: '#/components/schemas/Uuid'
    JoinClubRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: Club join code (8 chars) or invite code (12 chars); case-insensitive.
    Member:
      type: object
      additionalProperties: false
      required: [userId, username, role, status, joinedAt]
      properties:
        userId:
          $ref: '#/components/schemas/Uuid'
        username:
          type: string
        role:
          $ref: '#/components/schemas/ClubRole'
        status:
          $ref: '#/components/schemas/MemberStatus'
        joinedAt:
          $ref: '#/components/schemas/Timestamp'
    MemberPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        nextCursor:
          type: string
          nullable: true
    UpdateMemberRequest:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [ADMIN, AGENT, MEMBER]
        status:
          type: string
          enum: [ACTIVE, BANNED]
    Invite:
      type: object
      additionalProperties: false
      required: [id, clubId, role, maxUses, useCount, expiresAt, revokedAt, createdAt, status]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        clubId:
          $ref: '#/components/schemas/Uuid'
        role:
          type: string
          enum: [MEMBER, AGENT]
        maxUses:
          type: integer
        useCount:
          type: integer
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        revokedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        status:
          type: string
          enum: [ACTIVE, EXPIRED, EXHAUSTED, REVOKED]
    InviteCreated:
      type: object
      additionalProperties: false
      required: [invite, code]
      properties:
        invite:
          $ref: '#/components/schemas/Invite'
        code:
          type: string
          description: Plaintext invite code, returned only once.
    InviteList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invite'
    CreateInviteRequest:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [MEMBER, AGENT]
          default: MEMBER
        maxUses:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 720
          default: 72
    AuditRecord:
      type: object
      additionalProperties: false
      required:
        [
          id,
          actorUserId,
          actorUsername,
          clubId,
          action,
          objectType,
          objectId,
          before,
          after,
          requestId,
          createdAt,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        actorUserId:
          type: string
          format: uuid
          nullable: true
        actorUsername:
          type: string
          nullable: true
        clubId:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
        objectType:
          type: string
        objectId:
          type: string
          nullable: true
        before:
          type: object
          additionalProperties: true
          nullable: true
        after:
          type: object
          additionalProperties: true
          nullable: true
        requestId:
          type: string
          nullable: true
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    AuditPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditRecord'
        nextCursor:
          type: string
          nullable: true
    LedgerKind:
      type: string
      enum:
        [
          CLUB_GRANT,
          CLUB_DEDUCTION,
          PROMOTIONAL_CREDIT,
          ADMIN_ADJUSTMENT,
          TABLE_BUY_IN,
          TABLE_CASH_OUT,
          HAND_SETTLEMENT,
          REVERSAL,
          TOURNAMENT_BUY_IN,
          TOURNAMENT_REFUND,
          TOURNAMENT_PAYOUT,
        ]
    LedgerAccountKind:
      type: string
      enum: [CLUB_TREASURY, MEMBER_WALLET, TABLE_STACK, TOURNAMENT_POOL]
    Wallet:
      type: object
      additionalProperties: false
      required: [clubId, userId, balance]
      properties:
        clubId:
          $ref: '#/components/schemas/Uuid'
        userId:
          $ref: '#/components/schemas/Uuid'
        balance:
          $ref: '#/components/schemas/ChipAmount'
    WalletEntry:
      type: object
      additionalProperties: false
      required: [entryId, txId, kind, amount, balanceAfter, referenceType, referenceId, createdAt]
      properties:
        entryId:
          $ref: '#/components/schemas/Uuid'
        txId:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/LedgerKind'
        amount:
          $ref: '#/components/schemas/ChipAmount'
        balanceAfter:
          $ref: '#/components/schemas/ChipAmount'
        referenceType:
          type: string
          nullable: true
        referenceId:
          type: string
          nullable: true
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    WalletEntryPage:
